<svg xmlns="http://www.w3.org/2000/svg" width="4500" height="3000" viewBox="0 0 4500 3000" role="img" aria-labelledby="title desc">
  <title id="title">Job Search Radar Architecture</title>
  <desc id="desc">Program-owned fixed pipeline for job discovery, extraction, requirement understanding, eligibility gating, matching, and bounded agent tool planning.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#16324F" flood-opacity="0.10"/></filter>
    <marker id="arrow-program" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#286F9B"/></marker>
    <marker id="arrow-artifact" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65758B"/></marker>
    <marker id="arrow-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7C3AED"/></marker>
    <style>
      .bg{fill:#F7F9FC}.title{font:700 52px Inter,Arial,sans-serif;fill:#102A43}.subtitle{font:400 23px Inter,Arial,sans-serif;fill:#52667A}.section-title{font:700 25px Inter,Arial,sans-serif;letter-spacing:1.5px}.node-title{font:700 24px Inter,Arial,sans-serif;fill:#102A43}.node-title-sm{font:700 21px Inter,Arial,sans-serif;fill:#102A43}.body{font:400 18px Inter,Arial,sans-serif;fill:#40566C}.body-sm{font:400 16px Inter,Arial,sans-serif;fill:#40566C}.mono{font:500 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#334E68}.chip{font:700 15px Inter,Arial,sans-serif;letter-spacing:.8px}.phase{fill:#FFF;stroke:#D7E0EA;stroke-width:2;rx:24}.data{fill:#EDF7FF;stroke:#4B9ACA;stroke-width:2.5;rx:18}.program{fill:#ECF8F2;stroke:#2A8C6B;stroke-width:2.5;rx:18}.ai{fill:#F5EEFF;stroke:#7C3AED;stroke-width:2.5;rx:18}.summary{fill:#FFF7E8;stroke:#D58A1F;stroke-width:2.5;rx:18}.agent{fill:#F3E8FF;stroke:#7C3AED;stroke-width:3;rx:18}.tool{fill:#FFF0F0;stroke:#C9485B;stroke-width:2.5;rx:18}.persist{fill:#F3F6F9;stroke:#65758B;stroke-width:2.5;stroke-dasharray:10 8;rx:18}.arrow-program{fill:none;stroke:#286F9B;stroke-width:4;marker-end:url(#arrow-program)}.arrow-artifact{fill:none;stroke:#65758B;stroke-width:3;stroke-dasharray:9 8;marker-end:url(#arrow-artifact)}.arrow-agent{fill:none;stroke:#7C3AED;stroke-width:4;marker-end:url(#arrow-agent)}.divider{stroke:#D7E0EA;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="4500" height="3000"/>

  <g id="header">
    <text class="title" x="110" y="92">Job Search Radar Architecture</text>
    <text class="subtitle" x="110" y="135">Fixed program pipeline produces validated artifacts; the agent reads accumulated state and proposes one bounded next tool action.</text>
    <g transform="translate(3745 50)"><rect width="640" height="88" rx="18" fill="#E8F1F8" stroke="#B8CBD9" stroke-width="2"/><text class="node-title-sm" x="28" y="36">Control principle</text><text class="body-sm" x="28" y="64">Program owns pipeline • Executor owns side effects</text></g>
  </g>

  <g id="phase-discovery">
    <rect class="phase" x="90" y="190" width="4320" height="505" filter="url(#shadow)"/><text class="section-title" x="135" y="235" fill="#286F9B">01  DISCOVERY &amp; PAGE COLLECTION</text>
    <g id="node-user-profile" transform="translate(140 285)"><rect class="data" width="500" height="175"/><text class="node-title" x="28" y="45">UserProfile</text><text class="body" x="28" y="81">goals / skills / graduation year</text><text class="body" x="28" y="110">location &amp; role preferences</text><text class="body" x="28" y="139">exclusions / work authorization</text></g>
    <g id="node-search-plan" transform="translate(785 285)"><rect class="ai" width="500" height="175"/><text class="node-title" x="28" y="45">SearchPlan</text><text class="body" x="28" y="81">queries / companies / sources</text><text class="body" x="28" y="110">role families / location strategy</text><text class="body" x="28" y="139">bounded search budget</text></g>
    <g id="node-candidate-source" transform="translate(1430 285)"><rect class="data" width="500" height="175"/><text class="node-title" x="28" y="45">CandidateSource[]</text><text class="body" x="28" y="81">official / listing / campus pages</text><text class="body" x="28" y="110">source URL / apply URL</text><text class="body" x="28" y="139">source metadata retained by program</text></g>
    <g id="node-page-tools" transform="translate(2075 285)"><rect class="tool" width="500" height="175"/><text class="node-title" x="28" y="45">Page Tools</text><text class="body" x="28" y="81">search / fetch / follow links</text><text class="body" x="28" y="110">collect visible page content</text><text class="body" x="28" y="139">record ToolEvents</text></g>
    <g id="node-page-triage" transform="translate(2720 285)"><rect class="program" width="500" height="175"/><text class="node-title" x="28" y="45">Program Page Triage</text><text class="body" x="28" y="81">accept / pending / reject</text><text class="body" x="28" y="110">classify before extraction</text><text class="body" x="28" y="139">preserve important links</text></g>
    <g id="node-cleaned-page" transform="translate(3365 285)"><rect class="data" width="500" height="175"/><text class="node-title" x="28" y="45">CleanedPage[]</text><text class="body" x="28" y="81">title + cleaned visible_text</text><text class="body" x="28" y="110">page_id sent to extraction</text><text class="body" x="28" y="139">URLs remain on program side</text></g>
    <g id="node-pending-followups" transform="translate(3365 505)"><rect class="summary" width="500" height="125"/><text class="node-title-sm" x="28" y="40">PendingFollowups[]</text><text class="body-sm" x="28" y="72">listing links / detail links / apply portals</text><text class="body-sm" x="28" y="98">available to later agent planning</text></g>
    <path class="arrow-program" d="M640 372H785"/><path class="arrow-program" d="M1285 372H1430"/><path class="arrow-program" d="M1930 372H2075"/><path class="arrow-program" d="M2575 372H2720"/><path class="arrow-program" d="M3220 372H3365"/><path class="arrow-artifact" d="M3220 420C3290 420 3290 568 3365 568"/>
  </g>

  <g id="phase-extraction-preparation">
    <rect class="phase" x="90" y="735" width="4320" height="390" filter="url(#shadow)"/><text class="section-title" x="135" y="780" fill="#2A8C6B">02  EXTRACTION &amp; PROGRAM PREPARATION</text>
    <g id="node-ai-extraction" transform="translate(380 850)"><rect class="ai" width="690" height="190"/><text class="node-title" x="30" y="46">AI Extraction</text><text class="body" x="30" y="84">Cleaned page / JD → raw job fields</text><text class="body" x="30" y="116">title / company / location / description</text><text class="body" x="30" y="148">requirements text / deadline clues</text><text class="chip" x="500" y="48" fill="#7C3AED">JSON + PYDANTIC</text></g>
    <g id="node-raw-job-record" transform="translate(1375 850)"><rect class="data" width="620" height="190"/><text class="node-title" x="30" y="46">RawJobRecord[]</text><text class="body" x="30" y="84">model-extracted job fields</text><text class="body" x="30" y="116">program merges reliable source metadata</text><text class="body" x="30" y="148">no inferred eligibility facts yet</text></g>
    <g id="node-program-preparation" transform="translate(2300 850)"><rect class="program" width="690" height="190"/><text class="node-title" x="30" y="46">Program Preparation</text><text class="body" x="30" y="84">validation / normalization / deduplication</text><text class="body" x="30" y="116">merge source_url / apply_url / official status</text><text class="body" x="30" y="148">reject malformed extraction outputs</text></g>
    <g id="node-prepared-job-record" transform="translate(3295 850)"><rect class="data" width="690" height="190"/><text class="node-title" x="30" y="46">PreparedJobRecord[]</text><text class="body" x="30" y="84">normalized job + requirements string</text><text class="body" x="30" y="116">validated source and application metadata</text><text class="body" x="30" y="148">ready for gating and understanding</text></g>
    <path class="arrow-program" d="M3615 460V770H725V850"/><path class="arrow-program" d="M1070 945H1375"/><path class="arrow-program" d="M1995 945H2300"/><path class="arrow-program" d="M2990 945H3295"/>
  </g>

  <g id="phase-understanding-matching">
    <rect class="phase" x="90" y="1165" width="4320" height="720" filter="url(#shadow)"/><text class="section-title" x="135" y="1210" fill="#7C3AED">03  REQUIREMENT UNDERSTANDING &amp; MATCHING</text><text class="subtitle" x="135" y="1248">Requirement Understanding structures job facts. Matching primarily uses structured facts and does not own requirement extraction.</text>
    <g id="node-program-basic-gate" transform="translate(150 1345)"><rect class="program" width="610" height="250"/><text class="node-title" x="28" y="45">Program Basic Gate</text><text class="body" x="28" y="80">Skip obvious non-fits before AI tokens.</text><text class="body-sm" x="28" y="122">Uses only explicit PreparedJobRecord fields:</text><text class="body-sm" x="28" y="156">deadline / explicit graduation_years /</text><text class="body-sm" x="28" y="184">excluded location</text><text class="chip" x="28" y="218" fill="#2A8C6B">OUTPUT: BasicGateResult[]</text></g>
    <g id="node-ai-requirement-understanding" transform="translate(910 1345)"><rect class="ai" width="700" height="250"/><text class="node-title" x="28" y="45">AI Requirement Understanding</text><text class="body" x="28" y="80">PreparedJobRecord → structured job facts</text><text class="body-sm" x="28" y="116">hard requirements / nice-to-have / eligibility</text><text class="body-sm" x="28" y="146">risks / evidence / confidence</text><text class="body-sm" x="28" y="176">No user-to-job scoring in this node.</text><text class="chip" x="28" y="218" fill="#7C3AED">PYDANTIC-VALIDATED JSON</text></g>
    <g id="node-job-requirement-facts" transform="translate(1760 1290)"><rect class="data" width="760" height="360"/><text class="node-title" x="28" y="44">JobRequirementFacts[]</text><line class="divider" x1="28" y1="62" x2="732" y2="62"/><text class="mono" x="28" y="94">canonical_role • role_family • seniority</text><text class="mono" x="28" y="124">hard_requirements • nice_to_have_requirements</text><text class="mono" x="28" y="154">required_experience • degree_requirements</text><text class="mono" x="28" y="184">major_requirements • language_requirements</text><text class="mono" x="28" y="214">work_authorization_constraints</text><text class="mono" x="28" y="244">campus_eligibility • location_constraints</text><text class="mono" x="28" y="274">risk_flags • evidence • confidence</text><text class="body-sm" x="28" y="321">Comparable facts used by eligibility and matching.</text></g>
    <g id="node-program-eligibility-gate" transform="translate(2670 1345)"><rect class="program" width="660" height="250"/><text class="node-title" x="28" y="45">Program Eligibility Gate</text><text class="body" x="28" y="80">Conservative hard filters from</text><text class="body" x="28" y="107">high-confidence facts only.</text><text class="body-sm" x="28" y="143">experience / degree / major / language</text><text class="body-sm" x="28" y="171">work authorization / hard requirements</text><text class="chip" x="28" y="218" fill="#2A8C6B">OUTPUT: EligibilityGateResult[]</text></g>
    <g id="node-ai-match-analysis" transform="translate(3480 1345)"><rect class="ai" width="760" height="250"/><text class="node-title" x="28" y="45">AI Match Analysis</text><text class="body" x="28" y="80">UserProfile + JobRequirementFacts</text><text class="body" x="28" y="109">→ score / recommendation / strengths / gaps</text><text class="body-sm" x="28" y="147">Primarily uses structured facts; original text</text><text class="body-sm" x="28" y="175">may be consulted as supporting evidence.</text><text class="chip" x="28" y="218" fill="#7C3AED">PYDANTIC-VALIDATED JSON</text></g>
    <g id="node-match-assessment" transform="translate(2660 1695)"><rect class="data" width="660" height="125"/><text class="node-title-sm" x="28" y="42">MatchAssessment[]</text><text class="body-sm" x="28" y="73">validated score / recommendation / evidence</text><text class="body-sm" x="28" y="99">program caps and hard risks override AI</text></g>
    <g id="node-match-summary" transform="translate(3480 1695)"><rect class="summary" width="760" height="125"/><text class="node-title-sm" x="28" y="42">Match Summary</text><text class="body-sm" x="28" y="73">ranked accepted results / reasons / gaps</text><text class="body-sm" x="28" y="99">user-facing summary; no tool side effects</text></g>
    <path class="arrow-program" d="M3640 1040V1270H455V1345"/><path class="arrow-program" d="M760 1470H910"/><path class="arrow-program" d="M1610 1470H1760"/><path class="arrow-program" d="M2520 1470H2670"/><path class="arrow-program" d="M3330 1470H3480"/><path class="arrow-program" d="M3860 1595V1655H2990V1695"/><path class="arrow-program" d="M3320 1758H3480"/>
  </g>

  <g id="phase-agent-control">
    <rect class="phase" x="90" y="1925" width="4320" height="790" filter="url(#shadow)"/><text class="section-title" x="135" y="1970" fill="#7C3AED">04  ROUND ARTIFACTS &amp; BOUNDED AGENT CONTROL</text>
    <g id="node-round-artifacts" transform="translate(150 2040)"><rect class="summary" width="1320" height="455"/><text class="node-title" x="34" y="48">Round Artifacts / Run Summary</text><text class="body" x="34" y="83">Accumulated structured state for this run</text><line class="divider" x1="34" y1="104" x2="1286" y2="104"/><text class="mono" x="34" y="145">SearchPlan</text><text class="mono" x="34" y="180">CandidateSource[]</text><text class="mono" x="34" y="215">PendingFollowups[]</text><text class="mono" x="34" y="250">PreparedJobRecord[]</text><text class="mono" x="450" y="145">BasicGateResult[]</text><text class="mono" x="450" y="180">JobRequirementFacts[]</text><text class="mono" x="450" y="215">EligibilityGateResult[]</text><text class="mono" x="450" y="250">MatchAssessment[]</text><text class="mono" x="900" y="145">ToolEvents</text><text class="mono" x="900" y="180">RunLimits</text><text class="mono" x="900" y="215">PreviousQueries</text><text class="mono" x="900" y="250">Match Summary</text><rect x="34" y="298" width="1252" height="120" rx="14" fill="#FFFDF8" stroke="#E4B96C" stroke-width="2"/><text class="node-title-sm" x="60" y="337">Program-owned fixed pipeline</text><text class="body-sm" x="60" y="369">Produces artifacts independently of agent choices.</text><text class="body-sm" x="60" y="397">Agent receives a read-only structured summary.</text></g>
    <g id="node-agent-decision" transform="translate(1680 2075)"><rect class="agent" width="720" height="310"/><text class="node-title" x="32" y="50">Agent Decision / ContinueDecision</text><text class="body" x="32" y="89">Decide one bounded next action from</text><text class="body" x="32" y="119">accumulated structured state.</text><line class="divider" x1="32" y1="145" x2="688" y2="145"/><text class="body-sm" x="32" y="181">Does not replace extraction, gates,</text><text class="body-sm" x="32" y="207">requirement understanding, or matching.</text><text class="body-sm" x="32" y="241">Returns proposed ContinueDecision JSON.</text><text class="chip" x="32" y="278" fill="#7C3AED">NO DIRECT TOOL EXECUTION</text></g>
    <g id="node-tool-plan" transform="translate(2610 2015)"><rect class="agent" width="700" height="430"/><text class="node-title" x="30" y="48">ToolPlan</text><text class="body" x="30" y="82">Exactly one proposed action</text><line class="divider" x1="30" y1="104" x2="670" y2="104"/><text class="node-title-sm" x="30" y="145">stop</text><text class="body-sm" x="160" y="145">enough / low value / budget exhausted</text><text class="node-title-sm" x="30" y="190">search_more</text><text class="body-sm" x="160" y="190">revise query or source strategy</text><text class="node-title-sm" x="30" y="235">fetch_more</text><text class="body-sm" x="160" y="235">listing, detail, or apply-portal details</text><text class="node-title-sm" x="30" y="280">ask_user</text><text class="body-sm" x="160" y="280">missing or conflicting preferences</text><rect x="30" y="325" width="640" height="70" rx="12" fill="#ECF8F2" stroke="#2A8C6B" stroke-width="2"/><text class="node-title-sm" x="54" y="355">Program validates ToolPlan</text><text class="body-sm" x="54" y="381">schema / allowlist / limits / user state</text></g>
    <g id="node-tool-executor" transform="translate(3540 2075)"><rect class="tool" width="700" height="310"/><text class="node-title" x="32" y="50">ToolExecutor</text><text class="body" x="32" y="89">Only component allowed to execute tools.</text><line class="divider" x1="32" y1="115" x2="668" y2="115"/><text class="body-sm" x="32" y="153">Runs validated search / fetch / ask / stop.</text><text class="body-sm" x="32" y="184">Emits ToolEvents and bounded next-round inputs.</text><text class="body-sm" x="32" y="215">Never mutates pipeline artifacts directly.</text><text class="chip" x="32" y="267" fill="#C9485B">SIDE-EFFECT BOUNDARY</text></g>
    <path class="arrow-agent" d="M1470 2265H1680"/><path class="arrow-agent" d="M2400 2230H2610"/><path class="arrow-agent" d="M3310 2230H3540"/>
    <path class="arrow-artifact" d="M3860 1820V1892H810V2040"/>
    <text class="body-sm" x="1850" y="1880" fill="#65758B">accepted structured outputs accumulate here</text>
  </g>

  <g id="persistence-and-loop">
    <g id="node-sqlite-persistence" transform="translate(150 2760)"><rect class="persist" width="1410" height="145"/><text class="node-title-sm" x="30" y="43">SQLite Persistence</text><text class="body" x="30" y="78">Persist only accepted, validated pipeline outputs.</text><text class="body-sm" x="30" y="108">No speculative agent plan or rejected intermediate output is committed.</text></g>
    <g id="control-boundary-note" transform="translate(1740 2760)"><rect class="program" width="1350" height="145"/><text class="node-title-sm" x="30" y="43">Program enforcement boundary</text><text class="body" x="30" y="78">Validate • filter • cap scores • enforce limits • protect user state</text><text class="body-sm" x="30" y="108">All AI nodes return schema-validated JSON before downstream use.</text></g>
    <g id="legend" transform="translate(3270 2745)"><rect width="970" height="175" rx="18" fill="#FFF" stroke="#D7E0EA" stroke-width="2"/><text class="node-title-sm" x="28" y="38">Legend</text><rect class="data" x="28" y="58" width="42" height="28"/><text class="body-sm" x="84" y="79">Data artifact</text><rect class="program" x="260" y="58" width="42" height="28"/><text class="body-sm" x="316" y="79">Program</text><rect class="ai" x="468" y="58" width="42" height="28"/><text class="body-sm" x="524" y="79">AI</text><rect class="tool" x="640" y="58" width="42" height="28"/><text class="body-sm" x="696" y="79">Tool / side effect</text><path class="arrow-program" d="M28 125H145"/><text class="body-sm" x="165" y="131">Fixed pipeline</text><path class="arrow-artifact" d="M355 125H472"/><text class="body-sm" x="492" y="131">Artifact feed</text><path class="arrow-agent" d="M662 125H779"/><text class="body-sm" x="799" y="131">Validated plan flow</text></g>
    <path class="arrow-artifact" d="M2960 2445V2640H2415V2760"/>
    <path class="arrow-artifact" d="M810 2495V2670H855V2760"/>
    <path class="arrow-agent" d="M4240 2185H4380V255H1035V285"/>
    <path class="arrow-agent" d="M4240 2280H4420V272H2325V285"/>
    <text class="body-sm" x="1320" y="244" fill="#7C3AED">search_more revises SearchPlan and source strategy</text>
    <text class="body-sm" x="2670" y="266" fill="#7C3AED">fetch_more resumes page collection</text>
  </g>
</svg>
