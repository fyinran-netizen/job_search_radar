<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill:#0f1f3d; }
      .h2 { font: 700 22px Arial, sans-serif; }
      .h3 { font: 700 18px Arial, sans-serif; }
      .label { font: 600 15px Arial, sans-serif; fill:#10213f; }
      .small { font: 13px Arial, sans-serif; fill:#334155; }
      .tiny { font: 11px Arial, sans-serif; fill:#475569; }
      .box { rx:14; ry:14; stroke-width:2; }
      .subbox { rx:10; ry:10; stroke-width:1.5; }
      .arrow { stroke:#18324f; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
      .thin { stroke:#18324f; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#18324f"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="title">Job Search Radar — System Architecture</text>

  <!-- LAYER: External Inputs -->
  <g id="layer-external-inputs">
    <rect x="20" y="95" width="210" height="445" class="box" fill="#FFF7ED" stroke="#C88A4A"/>
    <text x="35" y="125" class="h2" fill="#8A4B16">External Inputs</text>

    <rect x="35" y="150" width="180" height="95" class="subbox" fill="#FDE7D3" stroke="#D99A61"/>
    <text x="55" y="178" class="h3" fill="#8A4B16">Candidate Profile</text>
    <text x="55" y="202" class="small">Skills, experience,</text>
    <text x="55" y="220" class="small">preferences, goals</text>

    <rect x="35" y="265" width="180" height="90" class="subbox" fill="#fff1f2" stroke="#fb7185"/>
    <text x="55" y="293" class="h3" fill="#be123c">Agent Limits</text>
    <text x="55" y="317" class="small">Budget, rate limits,</text>
    <text x="55" y="335" class="small">time, scope</text>

    <rect x="35" y="375" width="180" height="120" class="subbox" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text x="55" y="403" class="h3" fill="#5b21b6">External Job Sources</text>
    <text x="55" y="427" class="small">Job boards, company sites,</text>
    <text x="55" y="445" class="small">career pages, etc.</text>
  </g>

  <!-- LAYER: Interface -->
  <g id="layer-interface">
    <rect x="255" y="95" width="1090" height="130" class="box" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="278" y="125" class="h2" fill="#1d4ed8">1  Interface Layer</text>
    <text x="790" y="125" class="small">User interfaces and entry points</text>

    <rect x="280" y="145" width="315" height="60" class="subbox" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="302" y="172" class="h3" fill="#1d4ed8">Streamlit UI</text>
    <text x="302" y="191" class="small">Interactive web interface</text>

    <rect x="625" y="145" width="315" height="60" class="subbox" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="647" y="172" class="h3" fill="#1d4ed8">app.py (entry point)</text>
    <text x="647" y="191" class="small">Application bootstrap and configuration</text>

    <rect x="970" y="145" width="350" height="60" class="subbox" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="992" y="172" class="h3" fill="#1d4ed8">CLI</text>
    <text x="992" y="191" class="small">Command-line and alternate execution entry points</text>
  </g>

  <!-- LAYER: Service -->
  <g id="layer-service">
    <rect x="255" y="245" width="1090" height="125" class="box" fill="#ecfeff" stroke="#06b6d4"/>
    <text x="278" y="275" class="h2" fill="#0e7490">2  Application / Service Layer</text>
    <text x="800" y="275" class="small">Application orchestration and interface-facing services</text>

    <rect x="280" y="295" width="500" height="55" class="subbox" fill="#cffafe" stroke="#22d3ee"/>
    <text x="302" y="320" class="h3" fill="#155e75">services</text>
    <text x="302" y="339" class="small">Application orchestration, runtime setup, persistence use cases</text>

    <rect x="810" y="295" width="510" height="55" class="subbox" fill="#cffafe" stroke="#22d3ee"/>
    <text x="832" y="320" class="h3" fill="#155e75">frontend view models</text>
    <text x="832" y="339" class="small">UI models, formatting, and presentation-facing data</text>
  </g>

  <!-- LAYER: Agent Core -->
  <g id="layer-agent-core">
    <rect x="255" y="390" width="1090" height="300" class="box" fill="#fff1f2" stroke="#ef4444"/>
    <text x="278" y="420" class="h2" fill="#dc2626">3  Agent Orchestration Layer</text>
    <text x="770" y="420" class="small">Core planning, execution, and decision making</text>

    <rect x="275" y="440" width="1050" height="230" rx="16" ry="16" fill="#fff7f7" stroke="#fb7185" stroke-width="1.6" stroke-dasharray="7 6"/>
    <rect x="295" y="452" width="130" height="34" rx="17" ry="17" fill="#ef4444"/>
    <text x="360" y="475" text-anchor="middle" class="h3" fill="#ffffff">Agent Core</text>

    <rect x="650" y="455" width="230" height="55" class="subbox" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="670" y="482" class="h3" fill="#5b21b6">AgentState</text>
    <text x="670" y="501" class="small">Validated shared workflow state</text>

    <rect x="1000" y="455" width="240" height="55" class="subbox" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="1020" y="482" class="h3" fill="#5b21b6">Graph</text>
    <text x="1020" y="501" class="small">Execution graph and state transitions</text>

    <rect x="445" y="545" width="200" height="80" class="subbox" fill="#ffe4e6" stroke="#fb7185"/>
    <text x="465" y="575" class="h3" fill="#be123c">Scheduler</text>
    <text x="465" y="596" class="small">Scores available actions</text>
    <text x="465" y="614" class="small">and manages priorities</text>

    <rect x="700" y="545" width="210" height="80" class="subbox" fill="#ffe4e6" stroke="#fb7185"/>
    <text x="720" y="575" class="h3" fill="#be123c">Controller</text>
    <text x="720" y="596" class="small">Coordinates execution</text>
    <text x="720" y="614" class="small">and selects next action</text>

    <rect x="990" y="530" width="250" height="55" class="subbox" fill="#ffe4e6" stroke="#fb7185"/>
    <text x="1010" y="557" class="h3" fill="#be123c">Policies</text>
    <text x="1010" y="576" class="small">Availability rules and constraints</text>

    <rect x="990" y="600" width="250" height="55" class="subbox" fill="#ffe4e6" stroke="#fb7185"/>
    <text x="1010" y="627" class="h3" fill="#be123c">ToolExecutor</text>
    <text x="1010" y="646" class="small">Executes bounded tool actions</text>

    <rect x="300" y="525" width="110" height="35" class="subbox" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="355" y="548" text-anchor="middle" class="label">Limits</text>
    <rect x="300" y="570" width="110" height="35" class="subbox" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="355" y="593" text-anchor="middle" class="label">Backlog</text>
    <rect x="300" y="615" width="110" height="35" class="subbox" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="355" y="638" text-anchor="middle" class="label">Progress</text>

    <path d="M410 542 L445 565" class="thin"/>
    <path d="M410 587 L445 585" class="thin"/>
    <path d="M410 632 L445 605" class="thin"/>
    <path d="M645 585 L700 585" class="arrow"/>
    <path d="M805 545 L765 510" class="thin"/>
    <path d="M910 565 L990 557" class="thin"/>
    <path d="M910 605 L990 627" class="thin"/>
    <path d="M1000 482 L880 482" class="thin"/>
  </g>

  <!-- LAYER: Tools -->
  <g id="layer-tools">
    <rect x="165" y="715" width="1180" height="165" class="box" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="188" y="745" class="h2" fill="#b45309">4  Tool / Capability Layer</text>
    <text x="650" y="745" class="small">Bounded executable capabilities</text>

    <g id="tool-boxes">
      <rect x="185" y="775" width="130" height="78" class="subbox" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="250" y="801" text-anchor="middle" class="label">build_search_plan</text>
      <text x="250" y="823" text-anchor="middle" class="small">Search Plan</text>

      <rect x="325" y="775" width="120" height="78" class="subbox" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="385" y="801" text-anchor="middle" class="label">web_search</text>
      <text x="385" y="823" text-anchor="middle" class="small">Web Search</text>

      <rect x="455" y="775" width="120" height="78" class="subbox" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="515" y="801" text-anchor="middle" class="label">acquire_page</text>
      <text x="515" y="823" text-anchor="middle" class="small">Page Acquisition</text>

      <rect x="585" y="775" width="120" height="78" class="subbox" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="645" y="801" text-anchor="middle" class="label">analyze_page</text>
      <text x="645" y="823" text-anchor="middle" class="small">Page Analysis</text>

      <rect x="715" y="775" width="135" height="78" class="subbox" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="782" y="801" text-anchor="middle" class="label">explore_followups</text>
      <text x="782" y="823" text-anchor="middle" class="small">Follow-up Exploration</text>

      <rect x="860" y="775" width="125" height="78" class="subbox" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="922" y="801" text-anchor="middle" class="label">job_extraction</text>
      <text x="922" y="823" text-anchor="middle" class="small">Job Extraction</text>

      <rect x="995" y="775" width="140" height="78" class="subbox" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="1065" y="801" text-anchor="middle" class="label">job_understanding</text>
      <text x="1065" y="823" text-anchor="middle" class="small">Job Understanding</text>

      <rect x="1145" y="775" width="170" height="78" class="subbox" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="1230" y="801" text-anchor="middle" class="label">match_analysis</text>
      <text x="1230" y="823" text-anchor="middle" class="small">Match Assessment</text>
    </g>

    <path d="M805 625 L805 715" class="arrow"/>
    <path d="M1115 655 L1115 715" class="arrow"/>
  </g>

  <!-- LAYER: Infrastructure -->
  <g id="layer-infrastructure">
    <rect x="165" y="900" width="1180" height="120" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text x="188" y="930" class="h2" fill="#6d28d9">5  Infrastructure / Support Layer</text>
    <text x="650" y="930" class="small">Shared runtime, storage, LLM, and configuration support</text>

    <rect x="190" y="950" width="250" height="50" class="subbox" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="315" y="978" text-anchor="middle" class="label">LLM adapters / prompts</text>

    <rect x="460" y="950" width="250" height="50" class="subbox" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="585" y="978" text-anchor="middle" class="label">logging / runtime / paths</text>

    <rect x="730" y="950" width="280" height="50" class="subbox" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="870" y="978" text-anchor="middle" class="label">SQLite storage / repositories</text>

    <rect x="1030" y="950" width="290" height="50" class="subbox" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="1175" y="978" text-anchor="middle" class="label">config / test profile</text>
  </g>

  <!-- LAYER: Outputs -->
  <g id="layer-outputs">
    <rect x="1370" y="95" width="210" height="660" class="box" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="1387" y="125" class="h2" fill="#166534">Outputs / Results</text>

    <g class="outputs">
      <rect x="1390" y="150" width="170" height="70" class="subbox" fill="#dcfce7" stroke="#22c55e"/>
      <text x="1475" y="178" text-anchor="middle" class="label">Search Plans</text>
      <text x="1475" y="199" text-anchor="middle" class="tiny">Generated queries</text>

      <rect x="1390" y="235" width="170" height="70" class="subbox" fill="#dcfce7" stroke="#22c55e"/>
      <text x="1475" y="263" text-anchor="middle" class="label">Candidate Sources</text>
      <text x="1475" y="284" text-anchor="middle" class="tiny">URLs and source metadata</text>

      <rect x="1390" y="320" width="170" height="70" class="subbox" fill="#dcfce7" stroke="#22c55e"/>
      <text x="1475" y="348" text-anchor="middle" class="label">Page Documents</text>
      <text x="1475" y="369" text-anchor="middle" class="tiny">Fetched page content</text>

      <rect x="1390" y="405" width="170" height="70" class="subbox" fill="#dcfce7" stroke="#22c55e"/>
      <text x="1475" y="433" text-anchor="middle" class="label">Prepared Jobs</text>
      <text x="1475" y="454" text-anchor="middle" class="tiny">Structured job records</text>

      <rect x="1390" y="490" width="170" height="70" class="subbox" fill="#dcfce7" stroke="#22c55e"/>
      <text x="1475" y="518" text-anchor="middle" class="label">Understanding Records</text>
      <text x="1475" y="539" text-anchor="middle" class="tiny">Interpreted requirements</text>

      <rect x="1390" y="575" width="170" height="70" class="subbox" fill="#dcfce7" stroke="#22c55e"/>
      <text x="1475" y="603" text-anchor="middle" class="label">Match Assessments</text>
      <text x="1475" y="624" text-anchor="middle" class="tiny">Scores, gaps, risks</text>

      <rect x="1390" y="660" width="170" height="70" class="subbox" fill="#dcfce7" stroke="#22c55e"/>
      <text x="1475" y="688" text-anchor="middle" class="label">Final Results / Reports</text>
      <text x="1475" y="709" text-anchor="middle" class="tiny">Consolidated outputs</text>
    </g>
  </g>

  <!-- Main connectors -->
  <g id="connectors">
    <path d="M230 195 L255 195" class="arrow"/>
    <path d="M230 310 L255 310" class="arrow"/>
    <path d="M230 435 L255 435" class="arrow"/>

    <path d="M790 225 L790 245" class="arrow"/>
    <path d="M790 370 L790 390" class="arrow"/>
    <path d="M1345 610 L1370 610" class="arrow"/>

  </g>

  <!-- Legend -->
  <g id="legend">
    <rect x="20" y="1040" width="1560" height="45" rx="12" ry="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="40" y="1068" class="h3" fill="#0f172a">Legend</text>

    <rect x="135" y="1054" width="24" height="16" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="170" y="1068" class="small">Interface</text>

    <rect x="280" y="1054" width="24" height="16" fill="#cffafe" stroke="#06b6d4"/>
    <text x="315" y="1068" class="small">Service</text>

    <rect x="405" y="1054" width="24" height="16" fill="#ffe4e6" stroke="#ef4444"/>
    <text x="440" y="1068" class="small">Agent Core</text>

    <rect x="555" y="1054" width="24" height="16" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="590" y="1068" class="small">Tools</text>

    <rect x="665" y="1054" width="24" height="16" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="700" y="1068" class="small">Infrastructure</text>

    <rect x="830" y="1054" width="24" height="16" fill="#fce7f3" stroke="#db2777"/>
    <text x="865" y="1068" class="small">External Inputs</text>

    <rect x="1010" y="1054" width="24" height="16" fill="#dcfce7" stroke="#22c55e"/>
    <text x="1045" y="1068" class="small">Outputs</text>
  </g>
</svg>
